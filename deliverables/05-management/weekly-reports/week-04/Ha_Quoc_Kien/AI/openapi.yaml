        - 'Đã xác nhận: chỉ chủ đơn hủy được (O11), hủy đơn đã hủy trả 400 (O13)'
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Order canceled successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/apply-coupon:
    post:
      tags: [Coupons]
      summary: Áp dụng mã giảm giá cho tổng tiền
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B4: mã phần trăm tính sai. SAVE10 với 1.000.000 trả discount_amount = -9000000, final_amount = 10000000 (Q01, Q02)'
        - 'B14: đơn có giá trị đúng bằng mức tối thiểu bị từ chối, tức so sánh bằng > thay vì >= (Q04; FR-09 C3)'
        - 'B23: bỏ user_id khỏi body thì không kiểm tra lượt dùng (Q13; FR-09 C5)'
        - 'B26: không yêu cầu đăng nhập (Q08b; FR-09 C4). api_specification.md ghi endpoint này không cần token và ứng dụng mobile hiện không gửi token; hai tài liệu mâu thuẫn nhau'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
      responses:
        '200':
          description: Áp dụng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyCouponResponse'
              example:
                success: true
                coupon_id: 1
                discount_amount: 100000
                final_amount: 900000
                message: Áp dụng thành công! Giảm 10%
        '400':
          description: Mã hết hạn hoặc đơn chưa đạt giá trị tối thiểu (đã xác nhận E18, E19). Đã dùng hết lượt cũng trả 400 (đã xác nhận Q12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hetHan:
                  value:
                    error: Mã giảm giá đã hết hạn
                chuaDuToiThieu:
                  value:
                    error: Đơn hàng chưa đủ giá trị tối thiểu 300,000 ₫ để áp dụng mã này
        '404':
          description: Mã không tồn tại hoặc đã bị vô hiệu hóa (đã xác nhận E17)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Mã giảm giá không tồn tại hoặc đã bị vô hiệu hóa

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: |
        Theo SRS FR-09 điều kiện C4, người dùng phải đăng nhập. `api_specification.md` lại ghi endpoint này không cần token và ứng dụng mobile hiện không gửi token; hai tài liệu mâu thuẫn nhau (xem B26). Cần hỏi giảng viên.
