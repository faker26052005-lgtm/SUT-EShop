openapi: 3.0.3
info:
  title: EShop API
  version: 1.0.0
  description: |
    Đặc tả OpenAPI cho backend EShop (Node.js/Express + SQLite).

    Nguồn: `api_specification.md` của repo, README (SRS: các mã FR và SEC), code backend `server.js`, và response thật
    thu được khi chạy Postman collection ngày 13/10/2026.

    Nguyên tắc của file này: mô tả **hành vi MONG ĐỢI** theo đặc tả (ví dụ response không được lộ
    mật khẩu, id không tồn tại phải trả 404, API quản trị phải chặn người dùng thường).
    Những chỗ hệ thống thật đang lệch đặc tả được ghi ở trường mở rộng `x-known-deviations`
    của từng operation (tương ứng các lỗi B1 đến B33 trong Postman_Test_Report.md; mã test như U07, Q04 là test trong eshop_api_all_tests.postman_collection.json).

    Mã lỗi và thông điệp lỗi được ghi theo response thật thu được ở thư mục Errors của Postman
    collection (ca E1 đến E26, ngày 14/10/2026) và từ bộ test tổng hợp (118 assertion, ngày 15/10/2026). Lỗi luôn có dạng `{"error": "<thông điệp>"}`,
    Content-Type `application/json`. Các lỗi mà hệ thống thật KHÔNG trả (do thiếu kiểm tra dữ liệu
    đầu vào) vẫn được khai báo ở đây theo hành vi mong đợi, và ghi ở `x-known-deviations`.
servers:
  - url: http://localhost:3000
    description: Máy cục bộ (chạy bằng node server.js)
tags:
  - name: Auth
  - name: Users
  - name: Products
  - name: Categories
  - name: Cart
  - name: Orders
  - name: Coupons
  - name: Admin

paths:
  /api/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      security: []
      x-known-deviations:
        - 'B9: email đã tồn tại vẫn trả 200 và tạo thêm tài khoản (A08, E5)'
        - 'B10: body rỗng vẫn trả 200 và tạo tài khoản; không kiểm tra định dạng email và độ mạnh mật khẩu (A09, E6; FR-01)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithId'
              example:
                message: User registered successfully
                id: 3
        '400':
          description: Thiếu trường bắt buộc hoặc email đã tồn tại (hành vi mong đợi; hệ thống thật không kiểm tra, xem B9 và B10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, nhận JWT
      security: []
      x-known-deviations:
        - 'B1: response thật có user.password (mật khẩu chữ thường, SEC-01), cùng login_attempts, locked_until, reset_token (A02)'
        - 'B27: khóa sau 2 lần sai trong 3 phút, bộ đếm tăng 2 mỗi lần sai; SRS FR-02 yêu cầu khóa từ lần sai thứ 3, trong 30 giây, bộ đếm tăng đúng 1 (A06)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sai email hoặc mật khẩu (cùng một thông điệp cho cả hai trường hợp, đã xác nhận E1 đến E3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password
        '403':
          description: Tài khoản đang bị khóa tạm thời sau nhiều lần đăng nhập sai (đã xác nhận E4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Tài khoản đã bị khóa. Vui lòng thử lại sau.

  /api/forgot-password:
    post:
      tags: [Auth]
      summary: Yêu cầu mã đặt lại mật khẩu
      description: Theo đặc tả, mã được trả thẳng trong response (không gửi qua email).
      security: []
      x-known-deviations:
        - 'B28: resetToken chỉ có 4 chữ số và nằm ngay trong response; SRS FR-03 và SEC-07 yêu cầu 6 chữ số (A11)'
        - 'Quan sát: email không tồn tại trả 404 User not found, cho phép dò email đã đăng ký (E7)'
        - 'Chưa kiểm thử: mã OTP không có thời hạn (SEC-07)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Đã tạo mã đặt lại
          content:
            application/json:
              schema:
                type: object
                required: [message, resetToken]
                properties:
                  message:
                    type: string
                  resetToken:
                    type: string
                    example: '524618'
                    pattern: ^[0-9]{6}$
                    description: Mã OTP 6 chữ số (FR-03, SEC-07). Hệ thống thật trả 4 chữ số (B28).
        '404':
          description: Email không tồn tại (đã xác nhận E7)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: User not found

  /api/reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu bằng mã
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email:
                  type: string
                  format: email
                resetToken:
                  type: string
                newPassword:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Đặt lại thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Mã hoặc email không đúng (đã xác nhận E8)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid token or email

  /api/users/me:
    get:
      tags: [Users]
      summary: Xem hồ sơ cá nhân
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B2: response thật lộ password và reset_token, cùng login_attempts và locked_until (U02, U03)'
      responses:
        '200':
          description: Hồ sơ của người dùng đang đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Users]
      summary: Cập nhật hồ sơ cá nhân
      description: Chỉ cho phép đổi name, shipping_address, phone.
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B15: body có role vẫn được ghi, người dùng tự nâng thành admin (U07; SEC-06)'
        - 'B16: trường không gửi bị ghi đè thành null, ví dụ chỉ gửi name thì shipping_address và phone mất (U06)'
        - 'B30: số điện thoại không hợp lệ (ví dụ 9999) vẫn được lưu (U08; FR-04 yêu cầu bắt đầu bằng 0, 10 đến 11 chữ số)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                shipping_address:
                  type: string
                phone:
                  type: string
                  pattern: ^0[0-9]{9,10}$
                  description: Bắt đầu bằng số 0, có 10 đến 11 chữ số (FR-04). Hệ thống thật không kiểm tra (B30).
              additionalProperties: false
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Profile updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/products:
    get:
      tags: [Products]
      summary: Danh sách sản phẩm, có thể tìm theo tên
      security: []
      x-known-deviations:
        - "B17: tham số search được nối trực tiếp vào câu SQL; dấu ' gây lỗi 500 trả HTML, chuỗi ' OR 1=1 -- trả toàn bộ sản phẩm (P08, P09; SEC-05)"
      parameters:
        - name: search
          in: query
          required: false
          description: Chuỗi tìm theo tên sản phẩm
          schema:
            type: string
      responses:
        '200':
          description: Mảng sản phẩm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      summary: Thêm sản phẩm (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B8: gọi không có token vẫn tạo được sản phẩm (P10)'
        - 'B11: body rỗng hoặc thiếu trường vẫn tạo được sản phẩm (P12, P13)'
        - 'B31: giá âm vẫn tạo được sản phẩm (P19; FR-15 yêu cầu giá lớn hơn 0)'
        - 'Chưa kiểm thử: tên dài hơn 255 ký tự, danh mục không tồn tại (FR-15)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Đã tạo sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithId'
              example:
                message: Product created
                id: 6
        '400':
          description: Thiếu trường bắt buộc (hành vi mong đợi; hệ thống thật không kiểm tra, xem B11)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Products]
      summary: Chi tiết sản phẩm
      security: []
      x-known-deviations:
        - 'B3: với id chẵn (ví dụ 2) price trả về dạng chuỗi (P04)'
        - 'B7: id không tồn tại trả 200 và {} thay vì 404 (P05)'
      responses:
        '200':
          description: Sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Cập nhật sản phẩm (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B8: gọi không có token vẫn cập nhật được (P16)'
        - 'B12: id không tồn tại vẫn trả 200 Product updated thay vì 404 (P15)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Product updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Xóa sản phẩm (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B8: gọi không có token vẫn xóa được (P17)'
        - 'B12: id không tồn tại vẫn trả 200 Product deleted thay vì 404 (P18)'
      responses:
        '200':
          description: Đã xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/categories:
    get:
      tags: [Categories]
      summary: Danh sách danh mục
      security: []
      responses:
        '200':
          description: Mảng danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Thêm danh mục (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B24: người dùng thường (role user) vẫn tạo được danh mục (C04)'
        - 'B11: body rỗng vẫn tạo danh mục (C05; FR-14 yêu cầu tên bắt buộc)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Đã tạo danh mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithId'
              example:
                message: Category created
                id: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Categories]
      summary: Cập nhật danh mục (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B12: id không tồn tại vẫn trả 200 Category updated thay vì 404 (C07)'
        - 'B24: suy ra từ code, chỉ kiểm tra token, không kiểm tra role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Category updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      summary: Xóa danh mục (admin)
      security:
        - bearerAuth: []
      x-required-role: admin
      x-known-deviations:
        - 'B24: người dùng thường vẫn xóa được danh mục (C09)'
        - 'B12: id không tồn tại vẫn trả 200 Category deleted thay vì 404 (C08)'
      responses:
        '200':
          description: Đã xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/cart:
    get:
      tags: [Cart]
      summary: Xem giỏ hàng của người dùng đang đăng nhập
      description: Giỏ hàng lưu trong bộ nhớ của server, mất khi server khởi động lại. Ứng dụng mobile không gọi endpoint này.
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B20: giỏ hàng không bị xóa sau khi thanh toán (K05; FR-08)'
      responses:
        '200':
          description: Mảng sản phẩm trong giỏ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Cart]
      summary: Thêm sản phẩm vào giỏ
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B18: body rỗng vẫn được chấp nhận (K03)'
        - 'B19: price do client gửi được lưu nguyên, không đối chiếu với giá sản phẩm (K04)'
        - 'B25: thêm cùng một sản phẩm tạo dòng mới thay vì tăng quantity (K02b; FR-07)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Đã thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Added to cart
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/checkout:
    post:
      tags: [Orders]
      summary: Thanh toán, tạo đơn hàng
      description: |
        Đặc tả ghi body gồm `total_amount` và `shipping_address`. Ứng dụng mobile lại gửi
        `items`, `total_amount`, `coupon_id` và không gửi `shipping_address`.
        Backend chấp nhận cả hai; đơn tạo từ payload của mobile có `shipping_address` là null.
        QUYẾT ĐỊNH CẦN CHỐT: `shipping_address` bắt buộc hay tùy chọn.
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B13: giỏ hàng trống hoặc total_amount sai lệch giỏ hàng vẫn tạo được đơn (O03, O04; FR-08 yêu cầu backend tự tính lại tổng tiền)'
        - 'Quan sát: payload của mobile (không có shipping_address) vẫn được chấp nhận (O05)'
        - 'Quan sát: backend chỉ đọc total_amount và shipping_address, không đọc và không lưu items hoặc coupon_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              theoDacTa:
                summary: Theo api_specification.md
                value:
                  total_amount: 30000000
                  shipping_address: 123 Test
              theoMobile:
                summary: Đúng payload ứng dụng mobile gửi
                value:
                  items:
                    - id: 1
                      name: iPhone 15 Pro Max
                      price: 30000000
                      quantity: 1
                  total_amount: 30000000
                  coupon_id:
      responses:
        '200':
          description: Đã tạo đơn
          content:
            application/json:
              schema:
                type: object
                required: [message, orderId]
                properties:
                  message:
                    type: string
                  orderId:
                    type: integer
              example:
                message: Checkout successful
                orderId: 1
        '400':
          description: Giỏ hàng trống hoặc dữ liệu không hợp lệ (hành vi mong đợi; hệ thống thật không kiểm tra, xem B13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/orders/my-orders:
    get:
      tags: [Orders]
      summary: Lịch sử đơn hàng của người dùng đang đăng nhập
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mảng đơn hàng, mới nhất ở đầu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Orders]
      summary: Chi tiết một đơn hàng
      security:
        - bearerAuth: []
      x-known-deviations:
        - 'B6: không cần token và không kiểm tra chủ đơn, xem được đơn của người khác (O07, O08)'
        - 'Đã xác nhận: id không tồn tại trả 404 Order not found (O09)'
      responses:
        '200':
          description: Đơn hàng (không có danh sách món hàng)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Orders]
      summary: Hủy đơn hàng
      description: Chỉ hủy được khi đơn chưa giao.
      security:
        - bearerAuth: []
      x-known-deviations:
