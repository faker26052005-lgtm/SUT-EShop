components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT lấy từ POST /api/login. Payload gồm id, role, iat.
        Không có token: 401 {"error":"Unauthorized"}. Token sai hoặc hết hạn: 403 {"error":"Forbidden"}.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ. Nội dung `error` là thông điệp cụ thể của từng tình huống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Thiếu token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    Forbidden:
      description: Token không hợp lệ (đã xác nhận E10), hoặc có token nhưng không đủ quyền (hành vi mong đợi; hệ thống thật chưa kiểm tra role, xem B5)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Order not found

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MessageWithId:
      type: object
      required: [message, id]
      properties:
        message:
          type: string
        id:
          type: integer

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [message, token, user]
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          description: JWT
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      description: |
        Hồ sơ người dùng. Theo mong đợi KHÔNG chứa password và reset_token
        (hệ thống thật đang trả cả hai, xem B1 và B2).
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        shipping_address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    AdminUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        login_attempts:
          type: integer
        locked_until:
          type: string
          nullable: true
        shipping_address:
          type: string
          nullable: true

    Product:
      type: object
      required: [id, name, price, description, imageUrl, category_id]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
          minimum: 0
          description: Đơn vị VND. Hệ thống thật trả chuỗi với một số id (B3).
          example: 30000000
        description:
          type: string
        imageUrl:
          type: string
        category_id:
          type: integer

    ProductInput:
      type: object
      required: [name, price, category_id]
      description: |
        Theo mong đợi, name, price và category_id là bắt buộc. Hệ thống thật không kiểm tra trường nào:
        body rỗng hoặc thiếu bất kỳ trường nào vẫn tạo được sản phẩm (B11, E21 đến E25).
      properties:
        name:
          type: string
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Giá lớn hơn 0 (FR-15). Hệ thống thật chấp nhận cả giá âm (B31).
        description:
          type: string
        imageUrl:
          type: string
        category_id:
          type: integer

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CartItem:
      type: object
      required: [id, name, price, quantity]
      properties:
        id:
          type: integer
          description: Id của sản phẩm
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
          minimum: 1

    CheckoutRequest:
      type: object
      required: [total_amount]
      properties:
        total_amount:
          type: number
          minimum: 0
        shipping_address:
          type: string
          description: Có trong đặc tả, ứng dụng mobile không gửi
        items:
          type: array
          description: Chỉ ứng dụng mobile gửi. Chưa rõ backend có dùng hay không.
          items:
            $ref: '#/components/schemas/CartItem'
        coupon_id:
          type: integer
          nullable: true
          description: Chỉ ứng dụng mobile gửi

    OrderStatus:
      type: string
      enum: [pending, confirmed, shipping, delivered, canceled]

    Order:
      type: object
      required: [id, user_id, total_amount, status, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        total_amount:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        shipping_address:
          type: string
          nullable: true
        created_at:
          type: string
          description: Định dạng YYYY-MM-DD HH:MM:SS, không có múi giờ (không phải ISO 8601)
          example: '2026-10-13 12:25:29'

    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [user_name]
          properties:
            user_name:
              type: string

    ApplyCouponRequest:
      type: object
      required: [code, total_amount]
      properties:
        code:
          type: string
        total_amount:
          type: number
          minimum: 0
        user_id:
          type: integer
          nullable: true
          description: Ứng dụng mobile gửi user.id, hoặc null khi chưa đăng nhập

    ApplyCouponResponse:
      type: object
      required: [success, coupon_id, discount_amount, final_amount, message]
      properties:
        success:
          type: boolean
        coupon_id:
          type: integer
        discount_amount:
          type: number
          minimum: 0
        final_amount:
          type: number
          minimum: 0
        message:
          type: string

    Coupon:
      type: object
      required: [id, code, type, discount_value, min_order_amount, expired_at]
      properties:
        id:
          type: integer
        code:
          type: string
        type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
          description: Với percent, 10 nghĩa là 10%. Với fixed, là số tiền VND.
        min_order_amount:
          type: number
        expired_at:
          type: string
          example: '2099-12-31'
        is_active:
          type: integer
          enum: [0, 1]
        max_uses_per_user:
          type: integer

    CouponInput:
      type: object
      required: [code, type, discount_value, min_order_amount, expired_at, max_uses_per_user]
      properties:
        code:
          type: string
        type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
        min_order_amount:
          type: number
        expired_at:
          type: string
          example: '2027-12-31'
        max_uses_per_user:
          type: integer
          minimum: 1
