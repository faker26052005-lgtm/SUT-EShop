<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 210" width="1060" height="210" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="gate-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="gate-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <filter id="gate-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Step 1: Git Commit -->
  <g filter="url(#gate-shadow)">
    <rect x="20" y="72" width="170" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="105" y="100" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Git Push / PR</text>
    <text x="105" y="122" font-size="13" fill="#64748b" text-anchor="middle">Backend Commit</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="105" x2="238" y2="105" stroke="#475569" stroke-width="2.5" marker-end="url(#gate-arrow)" />

  <!-- Step 2: CI Build -->
  <g filter="url(#gate-shadow)">
    <rect x="245" y="72" width="190" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <text x="340" y="100" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">CI Build &amp; Test</text>
    <text x="340" y="122" font-size="13" fill="#64748b" text-anchor="middle">Compile &amp; Unit Tests</text>
  </g>

  <!-- Arrow 2 -> Gate -->
  <line x1="435" y1="105" x2="495" y2="105" stroke="#475569" stroke-width="2.5" marker-end="url(#gate-arrow)" />

  <!-- Step 3: PACT GATE (Diamond container) -->
  <g filter="url(#gate-shadow)">
    <polygon points="615,28 710,105 615,182 520,105" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" />
    <text x="615" y="97" font-size="15" font-weight="bold" fill="#854d0e" text-anchor="middle">🛡️ PACT GATE</text>
    <text x="615" y="119" font-size="13" font-weight="bold" fill="#a16207" text-anchor="middle">Provider Verify</text>
  </g>

  <!-- Branch Fail: Up/Right -> Block -->
  <path d="M 680,78 L 780,48 L 812,48" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#gate-arrow-red)" />
  <rect x="700" y="34" width="110" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="755" y="49" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Exit Code != 0</text>

  <g filter="url(#gate-shadow)">
    <rect x="820" y="16" width="220" height="64" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="930" y="43" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">❌ DỪNG PIPELINE</text>
    <text x="930" y="65" font-size="13" fill="#b91c1c" text-anchor="middle">Từ chối Release lên Production</text>
  </g>

  <!-- Branch Pass: Down/Right -> Deploy -->
  <path d="M 680,132 L 780,162 L 812,162" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#gate-arrow-green)" />
  <rect x="700" y="152" width="110" height="22" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
  <text x="755" y="167" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Exit Code == 0</text>

  <g filter="url(#gate-shadow)">
    <rect x="820" y="130" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="930" y="157" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">🚀 DEPLOYMENT AN TOÀN</text>
    <text x="930" y="179" font-size="13" fill="#15803d" text-anchor="middle">Phát hành Staging &amp; Production</text>
  </g>
</svg>
