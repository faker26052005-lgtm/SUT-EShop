<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 180" width="1130" height="180" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Solid arrowhead marker -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <!-- Dashed arrowhead marker -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <!-- Drop shadow -->
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ================= ROW 1: HAPPY PATH WORKFLOW ================= -->

  <!-- Box A: Sinh email timestamp -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="15" width="225" height="62" rx="8" fill="#fffde7" stroke="#fbc02d" stroke-width="2" />
    <text x="127.5" y="41" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Sinh email timestamp</text>
    <text x="127.5" y="61" font-size="14" fill="#92400e" text-anchor="middle">(Tránh Duplicate)</text>
  </g>

  <!-- Arrow A -> B -->
  <line x1="240" y1="46" x2="308" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#arrow-solid)" />

  <!-- Box B: 1. Register & 2. Login -->
  <g filter="url(#card-shadow)">
    <rect x="310" y="15" width="225" height="62" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" />
    <text x="422.5" y="41" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. Register &amp;</text>
    <text x="422.5" y="61" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2. Login</text>
  </g>

  <!-- Arrow B -> C with JWT Bearer label -->
  <line x1="535" y1="46" x2="603" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#arrow-solid)" />
  <rect x="541" y="34" width="64" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" opacity="0.95" />
  <text x="573" y="50" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">JWT Bearer</text>

  <!-- Box C: 3-5. Thêm giỏ & Xác nhận -->
  <g filter="url(#card-shadow)">
    <rect x="605" y="15" width="225" height="62" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" />
    <text x="717.5" y="41" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3-5. Thêm giỏ &amp;</text>
    <text x="717.5" y="61" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Xác nhận</text>
  </g>

  <!-- Arrow C -> D -->
  <line x1="830" y1="46" x2="898" y2="46" stroke="#475569" stroke-width="2" marker-end="url(#arrow-solid)" />

  <!-- Box D: 6. Checkout & 7. Orders -->
  <g filter="url(#card-shadow)">
    <rect x="900" y="15" width="215" height="62" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
    <text x="1007.5" y="41" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">6. Checkout &amp;</text>
    <text x="1007.5" y="61" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">7. Orders</text>
  </g>

  <!-- ================= ROW 2: NEGATIVE SECURITY TEST ================= -->

  <!-- Box E: Ca Negative: Không Token -->
  <g filter="url(#card-shadow)">
    <rect x="310" y="105" width="225" height="58" rx="8" fill="#263238" stroke="#546e7a" stroke-width="1.5" />
    <text x="422.5" y="140" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Ca Negative: Không Token</text>
  </g>

  <!-- Arrow E -> F (Dashed) with GET /api/cart label -->
  <line x1="535" y1="134" x2="603" y2="134" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)" />
  <rect x="539" y="122" width="74" height="24" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1" opacity="0.95" />
  <text x="576" y="138" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">GET /api/cart</text>

  <!-- Box F: Chặn 401 Unauthorized -->
  <g filter="url(#card-shadow)">
    <rect x="605" y="105" width="225" height="58" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="2" />
    <text x="717.5" y="140" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">Chặn 401 Unauthorized</text>
  </g>
</svg>